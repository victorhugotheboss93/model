<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Person 3D Viewer - Model 3D Auto-Fit</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
        }
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 25px;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #status-log {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #00ff00;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            font-family: monospace;
            border-radius: 5px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    <div id="status-log">Status: Se încarcă scena...</div>
    <div id="instructions">
        <h2>Click pentru a juca (First-Person)</h2>
        <p><b>W, A, S, D</b> - Mișcare<br><b>Mouse</b> - Privire în jur<br><small>Apasă tasta ESC pentru a ieși</small></p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const statusLog = document.getElementById('status-log');

        // 1. Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Cer albastru deschis
        scene.fog = new THREE.Fog(0x87ceeb, 20, 100);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. Lumini (Ambientală + Directă + Hemisferă)
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.8);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 3. Podea și Grilaj
        const floorMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 })
        );
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.receiveShadow = true;
        scene.add(floorMesh);

        const gridHelper = new THREE.GridHelper(100, 50, 0x00ff00, 0x666666);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // 4. Cub roșu de siguranță (Punct de referință vizuală)
        const testCube = new THREE.Mesh(
            new THREE.BoxGeometry(0.5, 0.5, 0.5),
            new THREE.MeshBasicMaterial({ color: 0xff0000 })
        );
        testCube.position.set(0, 0.25, 0);
        scene.add(testCube);

        // 5. Controale First Person
        const controls = new PointerLockControls(camera, document.body);
        const instructions = document.getElementById('instructions');

        instructions.addEventListener('click', () => controls.lock());
        controls.addEventListener('lock', () => instructions.style.display = 'none');
        controls.addEventListener('unlock', () => instructions.style.display = 'block');
        scene.add(controls.getObject());

        // 6. Mișcare Keyboard
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;

        const onKeyDown = (e) => {
            if (e.code === 'KeyW') moveForward = true;
            if (e.code === 'KeyS') moveBackward = true;
            if (e.code === 'KeyA') moveLeft = true;
            if (e.code === 'KeyD') moveRight = true;
        };

        const onKeyUp = (e) => {
            if (e.code === 'KeyW') moveForward = false;
            if (e.code === 'KeyS') moveBackward = false;
            if (e.code === 'KeyA') moveLeft = false;
            if (e.code === 'KeyD') moveRight = false;
        };

        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);

        // 7. Încărcare + Auto-Fit Model 3D
        const loader = new GLTFLoader();
        statusLog.innerText = "Status: Se încarcă model.glb...";

        loader.load('model.glb', (gltf) => {
            const model = gltf.scene;

            // Calculare automată dimensiuni (Bounding Box)
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());

            // Scalare automată astfel încât mașina să aibă lungimea de ~4 metri
            const maxDim = Math.max(size.x, size.y, size.z);
            if (maxDim > 0) {
                const targetSize = 4.0; // 4 metri
                const scale = targetSize / maxDim;
                model.scale.set(scale, scale, scale);
            }

            // Recalculare casetă după scalare pentru a așeza mașina perfect pe podea la (0,0,0)
            box.setFromObject(model);
            box.getCenter(center);

            model.position.x -= center.x;
            model.position.y -= box.min.y; // Asigură că stă pe podea
            model.position.z -= center.z;

            // Activare umbre și materiale duble
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    if (child.material) child.material.side = THREE.DoubleSide;
                }
            });

            scene.add(model);
            testCube.visible = false; // Ascunde cubul roșu odată ce mașina s-a încărcat
            statusLog.innerText = "Status: Model 3D încărcat cu succes!";
            statusLog.style.color = "#00ff00";
        }, 
        (xhr) => {
            if (xhr.total > 0) {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                statusLog.innerText = `Status: Se încarcă... ${percent}%`;
            }
        }, 
        (error) => {
            console.error(error);
            statusLog.innerText = "Status: EROARE! Fișierul 'model.glb' nu a putut fi găsit/încărcat.";
            statusLog.style.color = "#ff3333";
        });

        // 8. Animation Loop
        const clock = new THREE.Clock();
        const speed = 6.0;

        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked) {
                const delta = clock.getDelta();
                const moveDistance = speed * delta;

                if (moveForward) controls.moveForward(moveDistance);
                if (moveBackward) controls.moveBackward(moveDistance);
                if (moveLeft) controls.moveRight(-moveDistance);
                if (moveRight) controls.moveRight(moveDistance);
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
